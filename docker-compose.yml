services:

  agent:
    build:
      context: .
    container_name: musya_agent
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      thaijo:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chat-aio
      DB_USER: postgres
      DB_PASSWORD: 1234
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: uploads
      MINIO_USE_SSL: "false"
      PGVECTOR_COLLECTION: musya_documents
      HOST: "0.0.0.0"
      PORT: "8000"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      THAIJO_API_URL: http://thaijo:8000/api/v1/thaijo
      THAIJO_ENABLED: "true"
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - chatv1_net

  thaijo:
    build:
      context: ../thaijo
    container_name: thaijo_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8505:8000"
    depends_on:
      - redis
    networks:
      - chatv1_net

  redis:
    image: redis:7-alpine
    container_name: musya_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chatv1_net

  # Reuse ChatV1 infrastructure
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatv1_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat-aio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../ChatV1/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat-aio"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - chatv1_net

  minio:
    image: minio/minio:latest
    container_name: chatv1_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatv1_net

volumes:
  pgdata:
    external: true
    name: chatv1_pgdata
  minio_data:
    external: true
    name: chatv1_minio_data
  redis_data:
    name: musya_redis_data

networks:
  chatv1_net:
    name: chatv1_net
    driver: bridge
