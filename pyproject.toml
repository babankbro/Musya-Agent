[project]
name = "musya-agent"
version = "0.1.0"
description = "Agentic AI + RAG backend for Musya health plan document system"
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai[tools]>=1.1.0,<2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.29",
    "minio>=7.2",
    "chromadb>=0.5",
    "langchain-text-splitters>=0.3",
    "google-genai>=1.0",
    "langchain-google-genai>=2.0",
    "python-docx>=1.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "sse-starlette>=2.1",
    "PyMuPDF>=1.24",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
agent-server = "src.main:run"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
