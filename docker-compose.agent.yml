version: '3.8'

services:
  agent-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: musya-agent
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=chat-aio
      - DB_USER=postgres
      - DB_PASSWORD=1234
      - MINIO_ENDPOINT=host.docker.internal
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=uploads
      - MINIO_USE_SSL=false
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.0-flash
      - CHROMA_PERSIST_DIR=/app/chroma_data
      - CHROMA_COLLECTION=musya_documents
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=info
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./chroma_data:/app/chroma_data
      - ./doc:/app/doc
    networks:
      - agent-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # This ensures logs are visible
    tty: true
    stdin_open: true

networks:
  agent-network:
    driver: bridge
